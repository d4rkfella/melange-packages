package:
  name: vaultwarden
  version: "1.37.2"
  epoch: 2
  description: "Unofficial Bitwarden compatible server written in Rust (glibc)"
  copyright:
    - license: GPL-3.0-or-later
  dependencies:
    runtime:
      - libssl3
      - libpq-18

environment:
  environment:
    FEATURES: "postgresql"
    REPRODUCIBLE: false
  contents:
    packages:
      - wolfi-base
      - cargo-auditable
      - pkgconf
      - clang
      - rust
      - curl
      - openssl-dev
      - postgresql-dev
      - zlib-dev
      - bash
      - build-base
      - nodejs-24
      - npm-12
      - python-3.14
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dani-garcia/vaultwarden
      tag: ${{package.version}}
      expected-commit: 46d71107f5094460dd5ecbe1dbac6e6c71e5189a
      destination: vaultwarden

  - name: build-vaultwarden
    working-directory: /home/build/vaultwarden
    runs: |
      cargo auditable build \
        --features ${FEATURES} \
        --release \
        --target ${{build.arch}}-unknown-linux-gnu \
        --bin vaultwarden

  - uses: git-checkout
    with:
      repository: https://github.com/dani-garcia/bw_web_builds
      destination: bw_web_builds

  - name: build-web-vault
    working-directory: /home/build/bw_web_builds
    runs: |
      set -eux
      git fetch --tags
      BW_WEB_BUILDS_VERSION=$(yq '.vault_version' /home/build/vaultwarden/docker/DockerSettings.yaml | tr -d '"')
      git checkout "${BW_WEB_BUILDS_VERSION}"
      export VAULT_VERSION=$(grep '^ARG VAULT_VERSION=' Dockerfile | cut -d'=' -f2)
      echo ${VAULT_VERSION}
      make checkout
      cd web-vault
      WEB_VAULT_TAG=$(git describe --tags --exact-match 2>/dev/null || git describe --tags 2>/dev/null || echo "${VAULT_VERSION}")
      echo "WEB_VAULT_TAG: ${WEB_VAULT_TAG}"
      npm ci
      cd apps/web
      npm run dist:oss:selfhost
      cd build
      printf '{"version":"%s"}\n' "${WEB_VAULT_TAG}" > vw-version.json

  - name: prepare-package
    runs: |
      mkdir -p ${{targets.destdir}}/usr/bin
      mkdir -p ${{targets.destdir}}/usr/lib/vw_web_vault
      cp /home/build/vaultwarden/target/${{build.arch}}-unknown-linux-gnu/release/vaultwarden ${{targets.destdir}}/usr/bin/vaultwarden
      install -m555 -D start.sh ${{targets.destdir}}/usr/bin/start.sh
      cp -r /home/build/bw_web_builds/web-vault/apps/web/build/* ${{targets.destdir}}/usr/lib/vw_web_vault

test:
  environment:
    contents:
      packages:
        - curl
        - bash
        - jq
        - xmlstarlet
        - postgresql-18
        - postgresql-18-client
        - sudo
        - shadow
  pipeline:
    - name: Check for missing dependancies
      uses: test/tw/ldd-check
      with:
        packages: ${{package.name}}

    - name: Verify vaultwarden binary and web vault assets
      runs: |
        set -eux

        test -x /usr/bin/vaultwarden
        /usr/bin/vaultwarden --version

        test -f /usr/lib/vw_web_vault/index.html
        test -f /usr/lib/vw_web_vault/vw-version.json
        jq -e '.version' /usr/lib/vw_web_vault/vw-version.json

    - name: Start Postgres + vaultwarden and verify HTTP response
      runs: |
        set -eux

        useradd pgtest
        sudo -u pgtest initdb -D /tmp/pgdata
        sudo -u pgtest pg_ctl -D /tmp/pgdata -o "-k /tmp -h 127.0.0.1 -p 5432" -l /tmp/postgres.log start
        sudo -u pgtest createuser -h 127.0.0.1 -p 5432 vaultwarden --superuser
        sudo -u pgtest createdb -h 127.0.0.1 -p 5432 -O vaultwarden vaultwarden

        export DATA_FOLDER=/tmp/vw-data
        export DATABASE_URL="postgresql://vaultwarden@127.0.0.1:5432/vaultwarden"
        export WEB_VAULT_FOLDER=/usr/lib/vw_web_vault
        export ROCKET_ADDRESS=127.0.0.1
        export ROCKET_PORT=8000
        export ADMIN_TOKEN=test-admin-token
        mkdir -p "${DATA_FOLDER}"

        /usr/bin/vaultwarden > /tmp/vaultwarden.log 2>&1 &
        VW_PID=$!
        trap 'kill "${VW_PID}" 2>/dev/null || true; sudo -u pgtest pg_ctl -D /tmp/pgdata -m fast stop || true' EXIT

        up=0
        for i in $(seq 1 30); do
          if curl -fsS "http://127.0.0.1:8000/alive" > /tmp/alive.out 2>/dev/null; then
            up=1
            break
          fi
          sleep 1
        done

        if [ "${up}" -ne 1 ]; then
          echo "vaultwarden never became healthy" >&2
          cat /tmp/vaultwarden.log >&2
          exit 1
        fi

        cat /tmp/alive.out
        curl -fsS "http://127.0.0.1:8000/api/config" | tee /tmp/config.json
        jq -e '.version != null' /tmp/config.json
        jq -e '.server.name == "Vaultwarden"' /tmp/config.json
        curl -fsS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000/" | grep -q '^200$'

update:
  enabled: true
  github:
    identifier: dani-garcia/vaultwarden
    strip-prefix: v

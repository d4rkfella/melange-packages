package:
  name: opnsense-exporter
  version: "0.0.18"
  epoch: 0
  description: OPNsense Exporter for Prometheus
  copyright:
    - license: Apache-2.0
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/AthennaMind/opnsense-exporter
      tag: v${{package.version}}
      expected-commit: 07db0cc87e2b80a93074c73a05c210e1e8afb55a
  - uses: go/build
    with:
      packages: main.go
      output: opnsense-exporter
      ldflags: -X 'main.version=${{package.version}}'
update:
  enabled: true
  github:
    identifier: AthennaMind/opnsense-exporter
    strip-prefix: v

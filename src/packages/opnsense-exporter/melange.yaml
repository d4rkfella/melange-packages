package:
  name: opnsense-exporter
  version: "0.0.14"
  epoch: 1
  description: OPNsense Exporter for Prometheus
  copyright:
    - license: Apache-2.0
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/AthennaMind/opnsense-exporter
      tag: v${{package.version}}
      expected-commit: dfb51343b3fbca7e86ea4e2af8a9d204e3c8da75
  - uses: go/build
    with:
      packages: main.go
      output: opnsense-exporter
      ldflags: -X 'main.version=${{package.version}}'
update:
  enabled: true
  github:
    identifier: AthennaMind/opnsense-exporter
    strip-prefix: v

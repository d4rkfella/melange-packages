package:
  name: opnsense-exporter
  version: "0.0.15"
  epoch: 0
  description: OPNsense Exporter for Prometheus
  copyright:
    - license: Apache-2.0
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/AthennaMind/opnsense-exporter
      tag: v${{package.version}}
      expected-commit: 95d80d5eb8136a8b08436baec0be5f0016027cb8
  - uses: go/build
    with:
      packages: main.go
      output: opnsense-exporter
      ldflags: -X 'main.version=${{package.version}}'
update:
  enabled: true
  github:
    identifier: AthennaMind/opnsense-exporter
    strip-prefix: v

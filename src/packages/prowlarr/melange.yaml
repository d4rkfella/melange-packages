package:
  name: prowlarr
  version: "3.0.0.5737"
  epoch: 0
  description: Prowlarr is an indexer manager/proxy built on the popular *arr .net/reactjs base stack to integrate with your various PVR apps. Prowlarr supports management of both Torrent Trackers and Usenet Indexers. It integrates seamlessly with Lidarr, Mylar3, Radarr, Readarr, and Sonarr offering complete management of your indexers with no per app Indexer setup required (we do it all).
  copyright:
    - license: GPL-3.0-only
  dependencies:
    runtime:
      - libicu78
      - sqlite-libs
      - zlib
      - so:libssl.so.3
      - so:libgssapi_krb5.so.2
environment:
  environment:
    DOTNET_CLI_TELEMETRY_OPTOUT: 1
  contents:
    packages:
      - wolfi-baselayout
      - dotnet-sdk-10.0.4
      - nodejs-24
      - yarn
pipeline:
  - uses: git-checkout
    with:
      expected-commit: b8d1e7753ec1178d56a8d4735479357d259de335
      repository: https://github.com/Prowlarr/Prowlarr
      tag: v${{package.version}}
  - name: Build
    runs: |
      if [[ "${{build.arch}}" == "aarch64" ]]; then
        runtime_arch="arm64"
      elif [[ "${{build.arch}}" == "x86_64" ]]; then
        runtime_arch="x64"
      fi

      export BROWSERSLIST_IGNORE_OLD_DATA=true

      yarn install --frozen-lockfile --network-timeout 120000

      _dotnet_arch="$runtime_arch"
      _runtime="linux-$_dotnet_arch"
      _framework=$(sed -n 's:.*<TargetFrameworks>\([^<;]*\).*:\1:p' src/NzbDrone.Host/Prowlarr.Host.csproj | head -n1)
      _output="_output"
      _destdir="${{targets.destdir}}/usr/lib/prowlarr"
      _artifacts="$_output/$_framework/$_runtime/publish"

      ulimit -n 4096

      dotnet msbuild -restore src/Prowlarr.sln \
        -p:Configuration=Release \
        -p:Platform=Posix \
        -p:RuntimeIdentifiers="$_runtime" \
        -p:SelfContained=true \
        -p:AssemblyConfiguration="master" \
        -p:AssemblyVersion="${{package.version}}" \
        -p:DebugSymbols=false \
        -p:DebugType=none \
        -p:SentryCliExecutable= \
        -p:SentryUploadSymbols=false \
        -p:SentryIncludeSources=false \
        -p:EmbedAllSources=false \
        -t:PublishAllRids

      yarn run build --env production

      echo "Preparing package"

      mkdir -p "$_destdir" "${{targets.destdir}}/usr/bin"

      printf "UpdateMethod=docker\nBranch=%s\nPackageVersion=%s\nPackageAuthor=[d4rkfella](https://github.com/d4rkfella)\n" "develop" "${{package.version}}" > "$_destdir/package_info"

      mv "$_output/UI" "$_artifacts"
      mv $_output/Prowlarr.Update/$_framework/$_runtime/publish $_artifacts/Prowlarr.Update

      echo "Adding Prowlarr.Mono to UpdatePackage"
      cp $_artifacts/Prowlarr.Mono.* $_artifacts/Prowlarr.Update
      cp $_artifacts/Openur.Mono.Unix.* $_artifacts/Prowlarr.Update
      cp $_artifacts/libMono.Unix.* $_artifacts/Prowlarr.Update

      find "$_artifacts" \( \
        -name "ServiceUninstall.*" -o \
        -name "ServiceInstall.*" -o \
        -name "Prowlarr.Windows.*" -o \
        -name "libcoreclrtraceptprovider.so" \
      \) -delete

      mv "$_artifacts" "$_destdir/bin"
      mv LICENSE "$_destdir/bin"

      ln -s /usr/lib/prowlarr/bin/Prowlarr "${{targets.destdir}}/usr/bin/Prowlarr"
test:
  environment:
    contents:
      packages:
        - curl
        - bash
        - jq
        - xmlstarlet
  pipeline:
    - name: Check for missing dependancies
      uses: test/tw/ldd-check
      with:
        packages: ${{package.name}}
    - name: Start prowlarr server and verify version from /api/v1/system/status response
      runs: |
        set -eo pipefail

        # Configuration
        EXPECTED_VERSION="${{package.version}}"
        SERVER_PORT=9696
        STARTUP_TIMEOUT=60

        echo "Starting server (expecting version: ${EXPECTED_VERSION})..."
        Prowlarr --nobrowser --data=/config >/tmp/server.log 2>&1 &

        echo "Waiting for server readiness (max ${STARTUP_TIMEOUT}s)..."
        timeout $STARTUP_TIMEOUT bash -c "
            while ! curl -sSf http://localhost:$SERVER_PORT >/dev/null 2>&1; do
                sleep 1
            done
        " || {
            echo "❌ Server failed to start within ${STARTUP_TIMEOUT}s" >&2
            echo "=== Server logs ===" >&2
            cat /tmp/server.log >&2
            exit 1
        }
        API_KEY=$(xmlstarlet sel -t -v "//ApiKey" /config/config.xml)
        version=$(curl -sSf http://localhost:$SERVER_PORT/api/v1/system/status?apikey=$API_KEY | jq -r '.version')
        [[ "$version" == "$EXPECTED_VERSION" ]] || {
            echo "❌ Version mismatch (expected ${EXPECTED_VERSION}, got ${version})" >&2
            exit 1
        }
        echo "✅ Version check passed (${version})"
update:
  enabled: true
  enable-prerelease-tags: true
  github:
    identifier: Prowlarr/Prowlarr
    strip-prefix: v

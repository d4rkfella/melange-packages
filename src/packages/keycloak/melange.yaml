package:
  name: keycloak-darkfellanet
  version: "26.8.2"
  epoch: 0
  description: Open Source Identity and Access Management For Modern Applications and Services
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash # Keycloak helper scripts require bash, aren't compatible with busybox.
      - merged-usrsbin
      - openjdk-${{vars.java-version}}-default-jvm
      - wolfi-baselayout
vars:
  java-version: 25
environment:
  contents:
    packages:
      - bash
      - build-base
      - gcc-13-default
      - nodejs-24
      - openjdk-${{vars.java-version}}-default-jdk
      - npm
      - pnpm
      - unzip
      - wolfi-base
      - node-gyp
      - icu-libs
  environment:
    LANG: en_US.UTF-8
    JAVA_HOME: /usr/lib/jvm/java-${{vars.java-version}}-openjdk
    REPRODUCIBLE: false
    DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/keycloak/keycloak
      tag: ${{package.version}}
      expected-commit: e514445f9dcdabc5bdcf67cab56c1e49655de067
  - runs: |
      gcc napi-static-assert.c -o /tmp/preload.so -fPIC -shared -ldl
  - runs: |
      export LD_PRELOAD=/tmp/preload.so

      echo "========== BUILDING KEYCLOAK =========="

      if ./mvnw clean install \
        -DskipTests \
        -Dmaven.test.skip=true \
        -DskipITs \
        -DskipProtoLock=true \
        -Pdistribution; then
        BUILD_STATUS=0
      else
        BUILD_STATUS=$?

        echo "========== KEYCLOAK BUILD FAILED =========="
        echo "Maven exit code: ${BUILD_STATUS}"

        echo "========== NODE AND PNPM =========="
        cd js
        node --version || true
        pnpm --version || true

        echo "========== KIOTA PACKAGE =========="
        pnpm list @kiota-community/kiota-gen --depth 1 || true

        echo "========== KIOTA EXECUTABLE LOCATIONS =========="
        find node_modules libs/keycloak-admin-client/node_modules \
          -iname '*kiota*' -print 2>/dev/null || true

        echo "========== KIOTA GENERATOR =========="
        cd libs/keycloak-admin-client

        if [ -x ../../node_modules/.bin/kiota ]; then
          echo "Found workspace Kiota executable"
          ../../node_modules/.bin/kiota --version || true
        elif [ -x node_modules/.bin/kiota ]; then
          echo "Found package Kiota executable"
          node_modules/.bin/kiota --version || true
        else
          echo "Kiota executable is missing"
        fi

        echo "========== GENERATED FILES =========="
        ls -lah src/generated/ || true
        ls -lah openapi.json || true
        cat src/generated/.kiota.log 2>/dev/null || true

        echo "========== END DIAGNOSTICS =========="

        unset LD_PRELOAD
        exit "$BUILD_STATUS"
      fi

      unset LD_PRELOAD

      echo "========== UNPACKING KEYCLOAK =========="

      mkdir -p ${{targets.destdir}}/usr/share/java

      unzip -d ${{targets.destdir}}/usr/share/java \
        quarkus/dist/target/keycloak-*.zip

      mv ${{targets.destdir}}/usr/share/java/keycloak-* \
        ${{targets.destdir}}/usr/share/java/keycloak

      mkdir -p ${{targets.destdir}}/usr/share/java/keycloak/data

      mkdir -p ${{targets.destdir}}/usr/bin

      for i in kc.sh kcadm.sh kcreg.sh; do
        ln -sf /usr/share/java/keycloak/bin/$i \
          ${{targets.destdir}}/usr/bin/$i
      done
  - uses: git-checkout
    with:
      repository: https://github.com/cloakwise-io/keycloak-custom-theme
      tag: v0.2.2
      expected-commit: 1f0ce962cf027f3d4e9f4bbe4b4ba2036472345a
  - runs: |
      pnpm install
      pnpm run build-keycloak-theme
      cp dist_keycloak/keycloak-theme-for-kc-all-other-versions.jar ${{targets.destdir}}/usr/share/java/keycloak/providers/keycloak-theme.jar
  - runs: |
      export KC_HEALTH_ENABLED=true
      export KC_METRICS_ENABLED=true
      export KC_DB=postgres
      cd "${{targets.destdir}}"/usr/share/java/keycloak && "${{targets.destdir}}"/usr/share/java/keycloak/bin/kc.sh build
subpackages:
  - name: ${{package.name}}-operator
    dependencies:
      runtime:
        - openjdk-${{vars.java-version}}-default-jdk
    pipeline:
      - name: "build and install files"
        runs: |
          cd operator
          ../mvnw clean package

          destdir="${{targets.subpkgdir}}/usr/share/java"
          mkdir -p "$destdir"
          maven_name="keycloak-operator-${{package.version}}"
          unzip "target/${maven_name}.zip" -d "$destdir"
          mv "${destdir}/${maven_name}" "${destdir}/quarkus-app"

          ls -lr "$destdir"
    test:
      pipeline:
        - name: "expected initialization error test"
          runs: |
            set +e
            output=$(java -Djava.util.logging.manager=org.jboss.logmanager.LogManager \
              -jar /usr/share/java/quarkus-app/quarkus-run.jar 2>&1)
            set -e
            echo "$output" | grep -q "Couldn't retrieve the currently connected namespace"
  - name: ${{package.name}}-operator-compat
    pipeline:
      - name: "install files"
        runs: |
          mkdir -p "${{targets.subpkgdir}}"/opt/
          ln -s /usr/share/java/quarkus-app/ "${{targets.subpkgdir}}"/opt/keycloak
    test:
      pipeline:
        - name: "verify expected link exists"
          runs: readlink /opt/keycloak
  - name: ${{package.name}}-compat
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/opt
          ln -s /usr/share/java/keycloak "${{targets.subpkgdir}}"/opt/
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout
test:
  pipeline:
    - name: "start daemon on localhost"
      uses: test/daemon-check-output
      with:
        start: "kc.sh start --hostname=localhost --https-key-store-password=MYPASSWORD"
        timeout: 60
        expected_output: |
          Listening on
          Keycloak ${{package.version}}
          Profile prod activated
        setup: |
          #!/bin/sh -ex
          echo "127.0.0.1 $(hostname)" >> /etc/hosts
          kspath=/usr/share/java/keycloak/conf/server.keystore
          keytool -v \
              -keystore $kspath \
              -alias localhost \
              -genkeypair -sigalg SHA512withRSA -keyalg RSA -dname CN=localhost \
              -storepass MYPASSWORD || {
                echo "failed [$?] to create keystore with keytool at $kspath"
                exit 1
          }
    - name: "version and help tests"
      runs: |
        kc.sh --version
        kc.sh --help
        kcadm.sh --help
        kcreg.sh --help
update:
  ignore-regex-patterns:
    - ".*nightly.*"
  enabled: true
  github:
    identifier: keycloak/keycloak

package:
  name: seerr
  version: "3.5.0"
  epoch: 1
  description: Open-source media request and discovery manager for Jellyfin, Plex, and Emby.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - nodejs-22
environment:
  environment:
    REPRODUCIBLE: false
    NEXT_TELEMETRY_DISABLED: 1
    CYPRESS_INSTALL_BINARY: 0
  contents:
    packages:
      - wolfi-baselayout
      - nodejs-22
      - pnpm
      - patch
pipeline:
  - uses: git-checkout
    with:
      expected-commit: e2f24cb46079746936516c723b09820360f95113
      repository: https://github.com/seerr-team/seerr
      tag: v${{package.version}}
      destination: seerr
  - name: Build
    working-directory: /home/build/seerr
    runs: |
      export COMMIT_TAG=$(git rev-parse HEAD)
      pnpm install --frozen-lockfile
      pnpm build
      pnpm prune --prod --ignore-scripts
  - name: Remove unused node module assets
    working-directory: /home/build/seerr
    runs: |
      if [ -d node_modules/.pnpm ]; then
        find node_modules/.pnpm -type d \( \
          -path "*ace-builds/src-noconflict" -o \
          -path "*ace-builds/src" -o \
          -path "*ace-builds/src-min" -o \
          -path "*country-flag-icons/react" -o \
          -path "*country-flag-icons/string" -o \
          -path "*country-flag-icons/1x1" -o \
          -path "*@heroicons/react/16" \
        \) -exec rm -rf {} + || true
      fi
      find node_modules -name "*musl*" | xargs rm -rf
  - name: Prepare package
    working-directory: /home/build/seerr
    runs: |
      mkdir -p "${{targets.destdir}}/usr/lib/seerr"
      rm -rf .next/cache
      echo "{\"commitTag\": \"$(git rev-parse HEAD)\"}" > committag.json
      cp -af seerr-api.yml next.config.ts package.json committag.json .next public dist node_modules "${{targets.destdir}}/usr/lib/seerr"
test:
  environment:
    contents:
      packages:
        - curl
        - bash
        - jq
  pipeline:
    - name: Check for missing dependancies
      uses: test/tw/ldd-check
      with:
        packages: ${{package.name}}
    
    - name: Start seerr server and verify version from /api/v1/status response
      working-directory: /usr/lib/${{package.name}}
      runs: |
        set -eo pipefail

        # Configuration
        EXPECTED_VERSION="${{package.version}}"
        SERVER_PORT=5055
        STARTUP_TIMEOUT=60

        export NODE_ENV=production
    
        echo "Starting server (expecting version: ${EXPECTED_VERSION})..."
        node dist/index.js >/tmp/server.log 2>&1 &
    
        echo "Waiting for server readiness (max ${STARTUP_TIMEOUT}s)..."
        timeout $STARTUP_TIMEOUT bash -c "
            while ! curl -sSf http://localhost:$SERVER_PORT >/dev/null 2>&1; do
                sleep 1
            done
        " || {
            echo "❌ Server failed to start within ${STARTUP_TIMEOUT}s" >&2
            echo "=== Server logs ===" >&2
            cat /tmp/server.log >&2
            exit 1
        }
    
        version=$(curl -sSf http://localhost:$SERVER_PORT/api/v1/status | jq -r '.version')
        [[ "$version" == "$EXPECTED_VERSION" ]] || {
            echo "❌ Version mismatch (expected ${EXPECTED_VERSION}, got ${version})" >&2
            exit 1
        }
        echo "✅ Version check passed (${version})"
update:
  enabled: true
  github:
    identifier: seerr-team/seerr
    strip-prefix: v

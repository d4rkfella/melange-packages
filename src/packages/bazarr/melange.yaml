package:
  name: bazarr
  version: "1.6.3_beta8"
  epoch: 0
  description: Bazarr is a companion application to Sonarr and Radarr. It manages and downloads subtitles based on your requirements. You define your preferences by TV show or movie and Bazarr takes care of everything for you.
  copyright:
    - license: GPL-3.0
  dependencies:
    runtime:
      - unrar
      - ffmpeg
var-transforms:
  - from: "${{package.version}}"
    match: "_beta"
    replace: "-beta."
    to: mangled-package-version
environment:
  environment:
    PYTHONHASHSEED: 0
    PYTHONDONTWRITEBYTECODE: 1
    HUSKY: 0
  contents:
    packages:
      - python-3.13
      - py3.13-pip
      - nodejs
      - npm
      - node-gyp
pipeline:
  - uses: git-checkout
    with:
      expected-commit: defdd70fc840c3fe973c68f55f9e28514c3d0e9e
      repository: https://github.com/morpheus65535/bazarr
      tag: v${{vars.mangled-package-version}}
  - uses: patch
    with:
      patches: GHSA-h95x-26f3-88hr.patch
  - name: Build frontend
    working-directory: /home/build/frontend
    runs: |
      npm ci --no-audit --no-fund
      npm run build
  - name: Prepare package
    runs: |
      set -euo pipefail

      APPDIR="${{targets.destdir}}/usr/lib/bazarr/app"

      mkdir -p "${APPDIR}"

      python3 -m venv --without-pip --copies "${APPDIR}/venv"

      pip install --upgrade --no-cache-dir --prefix "${APPDIR}/venv" -r requirements.txt -r postgres-requirements.txt

      git describe --abbrev=0 > VERSION && install -m444 VERSION "${APPDIR}"

      while IFS= read -r f
      do
          echo "**** copying $f to bazarr app directory ****"
          cp -r --parents "$f" "$APPDIR"
      done < .github/files_to_copy

      install -Dm444 LICENSE "${{targets.destdir}}/usr/share/licenses/bazarr/LICENSE"

      printf "UpdateMethod=docker\nBranch=development\nPackageVersion=${{package.version}}\nPackageAuthor=d4rkfella" > ${{targets.destdir}}/usr/lib/bazarr/package_info
test:
  environment:
    contents:
      packages:
        - curl
        - bash
        - jq
        - yq
  pipeline:
    - name: Check for missing dependancies
      uses: test/tw/ldd-check
      with:
        packages: ${{package.name}}
    - name: Start bazarr server and verify version from /api/system/status response
      working-directory: /usr/lib/${{package.name}}
      runs: |
        set -eo pipefail

        EXPECTED_VERSION="${{vars.mangled-package-version}}"
        SERVER_PORT=6767
        STARTUP_TIMEOUT=20

        echo "Starting server (expecting version: ${EXPECTED_VERSION})..."
        app/venv/bin/python app/bazarr.py --no-update >/tmp/server.log 2>&1 &

        echo "Waiting for server readiness (max ${STARTUP_TIMEOUT}s)..."
        timeout $STARTUP_TIMEOUT bash -c "
            while ! curl -sSf http://localhost:$SERVER_PORT >/dev/null 2>&1; do
                sleep 1
            done
        " || {
            echo "❌ Server failed to start within ${STARTUP_TIMEOUT}s" >&2
            echo "=== Server logs ===" >&2
            cat /tmp/server.log >&2
            exit 1
        }
        API_KEY=$(yq -r '.auth.apikey' app/data/config/config.yaml)
        version=$(curl -sSf http://localhost:$SERVER_PORT/api/system/status?apikey=$API_KEY | jq -r '.data.bazarr_version')
        [[ "$version" == "$EXPECTED_VERSION" ]] || {
            echo "❌ Version mismatch (expected ${EXPECTED_VERSION}, got ${version})" >&2
            exit 1
        }
        echo "✅ Version check passed (${version})"
update:
  enabled: true
  enable-prerelease-tags: true
  version-transform:
    - match: "-beta."
      replace: "_beta"
  github:
    identifier: morpheus65535/bazarr
    strip-prefix: v

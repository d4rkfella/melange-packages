package:
  name: radarr
  version: "6.4.0.10540"
  epoch: 4
  description: Movie download automation for usenet and torrents.
  copyright:
    - license: GPL-3.0-only
  dependencies:
    runtime:
      - icu
      - sqlite-libs
      - libssl3
      - zlib
environment:
  contents:
    packages:
      - build-base
      - ca-certificates-bundle
      - bash
      - curl
      - icu
pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0c78421d553f8395fee14171892da60650123c97
      repository: https://github.com/Radarr/Radarr
      tag: v${{package.version}}
  - name: Install dependancies
    runs: |
      curl -sSL https://get.volta.sh | bash
      curl -sSL https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.sh | bash -s -- --jsonfile global.json
  - name: Build
    runs: |
      if [[ "${{build.arch}}" == "aarch64" ]]; then
        runtime_arch="arm64"
      elif [[ "${{build.arch}}" == "x86_64" ]]; then
        runtime_arch="x64"
      fi

      PATH="$HOME/.volta/bin:$HOME/.dotnet:$PATH"      
      
      export BROWSERSLIST_IGNORE_OLD_DATA=true

      yarn install --frozen-lockfile --network-timeout 120000

      _dotnet_arch="$runtime_arch"
      _runtime="linux-$_dotnet_arch"
      _framework=$(sed -n 's:.*<TargetFrameworks>\([^<;]*\).*:\1:p' src/NzbDrone.Host/Radarr.Host.csproj | head -n1)
      _output="_output"
      _destdir="${{targets.destdir}}/usr/lib/radarr"
      _artifacts="$_output/$_framework/$_runtime/publish"

      ulimit -n 4096
      dotnet msbuild -restore src/Radarr.sln \
        -p:Configuration=Release \
        -p:Platform=Posix \
        -p:RuntimeIdentifiers="$_runtime" \
        -p:SelfContained=true \
        -p:AssemblyConfiguration="master" \
        -p:AssemblyVersion="${{package.version}}" \
        -p:DebugSymbols=false \
        -p:DebugType=none \
        -p:SentryCliExecutable= \
        -p:SentryUploadSymbols=false \
        -p:SentryIncludeSources=false \
        -p:EmbedAllSources=false \
        -t:PublishAllRids

      yarn run build --env production

      chmod +x "$_artifacts/ffprobe"

      echo "Preparing package"

      mkdir -p "$_destdir" "${{targets.destdir}}/usr/bin"

      printf "UpdateMethod=docker\nBranch=%s\nPackageVersion=%s\nPackageAuthor=[d4rkfella](https://github.com/d4rkfella)\n" "develop" "${{package.version}}" > "$_destdir/package_info"

      mv "$_output/UI" "$_artifacts"
      mv $_output/Radarr.Update/$_framework/$_runtime/publish $_artifacts/Radarr.Update

      echo "Adding Radarr.Mono to UpdatePackage"
      cp $_artifacts/Radarr.Mono.* $_artifacts/Radarr.Update
      cp $_artifacts/Mono.Posix.NETStandard.* $_artifacts/Radarr.Update
      cp $_artifacts/libMonoPosixHelper.* $_artifacts/Radarr.Update

      find "$_artifacts" \( \
        -name "ServiceUninstall.*" -o \
        -name "ServiceInstall.*" -o \
        -name "Radarr.Windows.*" -o \
        -name "libcoreclrtraceptprovider.so" \
      \) -delete

      mv "$_artifacts" "$_destdir/bin"
      mv LICENSE.md "$_destdir/bin"

      ln -s /usr/lib/radarr/bin/Radarr "${{targets.destdir}}/usr/bin/Radarr"
  - uses: strip
test:
  environment:
    contents:
      packages:
        - curl
        - bash
        - jq
        - xmlstarlet
  pipeline:
    - name: Check for missing dependancies
      uses: test/tw/ldd-check
      with:
        packages: ${{package.name}}
    - name: Run test script
      runs: |
        EXPECTED_VERSION="${{package.version}}" ./test.sh
update:
  enabled: true
  enable-prerelease-tags: true
  github:
    identifier: Radarr/Radarr
    strip-prefix: v

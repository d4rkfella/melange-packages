package:
  name: pgadmin4
  version: 9.13
  epoch: 0
  description: pgAdmin 4 - PostgreSQL Tools for the Web
  copyright:
    - license: PostgreSQL
  dependencies:
    runtime:
      - py${{vars.py-version}}-bcrypt
      - py${{vars.py-version}}-cryptography
      - py${{vars.py-version}}-ldap3
      - py${{vars.py-version}}-paramiko
      - py${{vars.py-version}}-psutil
vars:
  py-version: "3.13"
var-transforms:
  - from: ${{package.version}}
    match: '\.'
    replace: "_"
    to: mangled-package-version
environment:
  environment:
    PYTHONHASHSEED: 0
    PYTHONDONTWRITEBYTECODE: 1
    REPRODUCIBLE: false
  contents:
    packages:
      - build-base
      - python-${{vars.py-version}}-dev
      - py${{vars.py-version}}-pip
      - py${{vars.py-version}}-bcrypt
      - py${{vars.py-version}}-cryptography
      - py${{vars.py-version}}-ldap3
      - py${{vars.py-version}}-paramiko
      - py${{vars.py-version}}-psutil
      - postgresql-18-dev
      - nodejs
      - corepack
      - krb5-dev
      - bash
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pgadmin-org/pgadmin4
      tag: REL-${{vars.mangled-package-version}}
      expected-commit: "5b231ddd3f7aca5d6e7c03c21e7e1bc94b8c3b03"
  - name: build-venv
    runs: |
      python${{vars.py-version}} -m venv --system-site-packages --without-pip --copies /work/venv
      pip install --no-cache-dir --prefix=/work/venv -r requirements.txt
      pip install --no-cache-dir --prefix=/work/venv gunicorn==23.0.0
  - name: build-js
    runs: |
      cd web
      export CPPFLAGS="-DPNG_ARM_NEON_OPT=0"
      corepack enable
      yarn set version berry
      yarn set version 4
      yarn install
      yarn run bundle
      find pgadmin/static/js/generated/fonts -name '*..ttf' -o -name '*..woff2' | while read f; do
        mv "$f" "$(echo "$f" | sed 's/\.\./\./')"
      done
      rm -rf node_modules yarn.lock package.json .yarn babel.cfg webpack.* jest.config.js babel.*
  - name: install
    runs: |
      # App files
      mkdir -p "${{targets.destdir}}/usr/share/pgadmin4"
      cp -r web/. "${{targets.destdir}}/usr/share/pgadmin4/"

      mkdir -p "${{targets.destdir}}/usr/lib/pgadmin4"
      cp -r /work/venv "${{targets.destdir}}/usr/lib/pgadmin4/venv"

      cp pkg/docker/run_pgadmin.py pkg/docker/gunicorn_config.py \
         "${{targets.destdir}}/usr/share/pgadmin4/"

      mkdir -p "${{targets.destdir}}/usr/bin"
      cp pkg/docker/entrypoint.sh "${{targets.destdir}}/usr/bin/pgadmin4-entrypoint"
      chmod +x "${{targets.destdir}}/usr/bin/pgadmin4-entrypoint"

      touch "${{targets.destdir}}/usr/share/pgadmin4/config_distro.py"

      cp LICENSE "${{targets.destdir}}/usr/share/pgadmin4/LICENSE"

      mkdir -p "${{targets.destdir}}/var/lib/pgadmin" 

      find "${{targets.destdir}}" -type d -name '__pycache__' -exec rm -rf {} + || true
subpackages:
  - name: ${{package.name}}-compat
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/pgadmin4" "${{targets.subpkgdir}}/venv"
          ln -sf /usr/lib/pgadmin4/venv "${{targets.subpkgdir}}/venv"
          ln -sf /usr/share/pgadmin4/pgadmin "${{targets.subpkgdir}}/pgadmin4/pgadmin"
          ln -sf /usr/share/pgadmin4/run_pgadmin.py "${{targets.subpkgdir}}/pgadmin4/run_pgadmin.py"
          ln -sf /usr/share/pgadmin4/setup.py "${{targets.subpkgdir}}/pgadmin4/setup.py"
          ln -sf /usr/share/pgadmin4/gunicorn_config.py "${{targets.subpkgdir}}/pgadmin4/gunicorn_config.py"
          ln -sf /usr/share/pgadmin4/config_distro.py "${{targets.subpkgdir}}/pgadmin4/config_distro.py"
    dependencies:
      runtime:
        - ${{package.name}}=${{package.version}}
update:
  enabled: true
  version-transform:
    - match: _(\d+)$
      replace: .${1}
  github:
    identifier: pgadmin-org/pgadmin4
    strip-prefix: REL-
    tag-filter-prefix: REL-
    use-tag: true
test:
  pipeline:
    - name: Check for missing dependancies
      uses: test/tw/ldd-check
      with:
        packages: ${{package.name}}
    - name: Check pgadmin4 files are present
      runs: |
        test -f /usr/share/pgadmin4/run_pgadmin.py
        test -f /usr/share/pgadmin4/gunicorn_config.py
        test -f /usr/share/pgadmin4/config_distro.py
        test -x /usr/bin/pgadmin4-entrypoint
        test -f /usr/lib/pgadmin4/venv/bin/gunicorn
        test -f /usr/lib/tmpfiles.d/pgadmin4.conf

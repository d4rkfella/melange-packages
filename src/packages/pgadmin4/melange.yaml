package:
  name: pgadmin4
  version: "9.18"
  epoch: 4
  description: pgAdmin 4 - PostgreSQL Tools for the Web
  copyright:
    - license: PostgreSQL
  dependencies:
    runtime:
      - py${{vars.py-version}}-bcrypt
      - py${{vars.py-version}}-cryptography
      - py${{vars.py-version}}-ldap3
      - py${{vars.py-version}}-psutil
      - postgresql-18-pgadmin-compat
vars:
  py-version: "3.13"
var-transforms:
  - from: ${{package.version}}
    match: '\.'
    replace: "_"
    to: mangled-package-version
environment:
  environment:
    REPRODUCIBLE: false
  contents:
    packages:
      - build-base
      - python-${{vars.py-version}}-dev
      - py${{vars.py-version}}-pip
      - py${{vars.py-version}}-bcrypt
      - py${{vars.py-version}}-cryptography
      - py${{vars.py-version}}-ldap3
      - py${{vars.py-version}}-psutil
      - postgresql-18-dev
      - nodejs
      - corepack
      - krb5-dev
      - bash
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pgadmin-org/pgadmin4
      tag: REL-${{vars.mangled-package-version}}
      expected-commit: "f09776c22d9dc7c1130f01d416ee43c5db5f11cb"
  - name: setup-venv
    runs: |
      mkdir -p ${{targets.destdir}}/usr/lib/pgadmin4
      python${{vars.py-version}} -m venv --system-site-packages --without-pip --copies ${{targets.destdir}}/usr/lib/pgadmin4/venv
      ${{targets.destdir}}/usr/lib/pgadmin4/venv/bin/python3 -m pip install --no-cache-dir -r requirements.txt
      ${{targets.destdir}}/usr/lib/pgadmin4/venv/bin/python3 -m pip install --no-cache-dir gunicorn==26.2.0
      ${{targets.destdir}}/usr/lib/pgadmin4/venv/bin/python3 -m pip install --no-cache-dir sphinx sphinxcontrib-youtube
  - name: build-docs
    runs: |
      ${{targets.destdir}}/usr/lib/pgadmin4/venv/bin/python3 -m sphinx.cmd.build docs/en_US docs/en_US/_build/html
      rm -rf docs/en_US/_build/html/.doctrees
      rm -rf docs/en_US/_build/html/_sources
      rm -rf docs/en_US/_build/html/_static/*.png
  - name: build-js
    runs: |
      cd web
      export CPPFLAGS="-DPNG_ARM_NEON_OPT=0"
      corepack enable
      yarn install
      yarn run bundle
      rm -rf node_modules pgadmin/static/js/generated/.cache yarn.lock package.json .[^.]* babel.cfg webpack.* jest.config.js babel.*
  - name: prepare package
    runs: |
      mkdir -p "${{targets.destdir}}/usr/lib/pgadmin4/docs"
      cp -r web/. "${{targets.destdir}}/usr/lib/pgadmin4/"
      cp -r docs/en_US/_build/html/. "${{targets.destdir}}/usr/lib/pgadmin4/docs/"
      install -Dm444 run_pgadmin.py "${{targets.destdir}}/usr/lib/pgadmin4/"
      install -Dm444 config_distro.py "${{targets.destdir}}/usr/lib/pgadmin4/config_distro.py"
      install -Dm444 gunicorn_config.py "${{targets.destdir}}/usr/lib/pgadmin4/gunicorn_config.py"
      install -Dm444 LICENSE "${{targets.destdir}}/usr/share/licenses/pgadmin4/LICENSE"
      find "${{targets.destdir}}" -type d -name '__pycache__' -exec rm -rf {} + || true
update:
  enabled: true
  version-transform:
    - match: _(\d+)$
      replace: .${1}
  github:
    identifier: pgadmin-org/pgadmin4
    strip-prefix: REL-
    tag-filter-prefix: REL-
    use-tag: true
  ignore-regex-patterns:
    - '^REL-[0-9]+_[0-9]+-.+$'
test:
  environment:
    environment:
      PGADMIN_SETUP_EMAIL: "pgadmin4@example.com"
      PGADMIN_SETUP_PASSWORD: "pgadmin4"
      PYTHONPATH: /usr/lib/pgadmin4
  pipeline:
    - name: Check for missing dependancies
      uses: test/tw/ldd-check

    - name: Start pgAdmin server and verify /misc/ping API response
      runs: |
        set -eo pipefail

        # Configuration
        SERVER_PORT=8080
        STARTUP_TIMEOUT=120
        SERVER_LOG=/tmp/pgadmin4-server.log

        export PGADMIN_LISTEN_ADDRESS=127.0.0.1
        export PGADMIN_LISTEN_PORT=$SERVER_PORT

        echo "Starting pgAdmin server..."
        /usr/lib/pgadmin4/venv/bin/python3 -m gunicorn \
          -c /usr/lib/pgadmin4/gunicorn_config.py \
          run_pgadmin:app \
          >"$SERVER_LOG" 2>&1 &

        GUNICORN_PID=$!

        echo "Gunicorn master PID: $GUNICORN_PID"
        echo "Waiting for server readiness (max ${STARTUP_TIMEOUT}s)..."

        timeout "$STARTUP_TIMEOUT" bash -c "
          while ! curl -sSf http://localhost:$SERVER_PORT/misc/ping >/dev/null 2>&1; do
            sleep 1
          done
        " || {
            echo "❌ pgAdmin server failed to start within ${STARTUP_TIMEOUT}s" >&2

            echo "=== Sending SIGUSR1 to Gunicorn master ===" >&2
            kill -USR1 "$GUNICORN_PID" 2>/dev/null || true

            sleep 2

            worker_pid=$(sed -n \
              's/.*Booting worker with pid: \([0-9][0-9]*\).*/\1/p' \
              "$SERVER_LOG" | tail -n 1)

            if [ -n "$worker_pid" ]; then
                echo "Gunicorn worker PID: $worker_pid" >&2
                echo "=== Sending SIGUSR1 to Gunicorn worker ===" >&2
                kill -USR1 "$worker_pid" 2>/dev/null || true
                sleep 2
            else
                echo "No worker PID found in server logs." >&2
            fi

            echo "=== Server logs ===" >&2
            cat "$SERVER_LOG" >&2

            echo "=== Process status ===" >&2
            ps -ef >&2 || true

            exit 1
        }

        response=$(curl -sSf http://localhost:$SERVER_PORT/misc/ping)

        if [[ "$response" != "PING" ]]; then
            echo "❌ Unexpected /misc/ping response (expected PING, got ${response})" >&2
            echo "=== Server logs ===" >&2
            cat "$SERVER_LOG" >&2
            exit 1
        fi

        echo "✅ pgAdmin API check passed (/misc/ping -> ${response})"

name: Melange Build

on: 
  push:
    branches: ["main"]
    paths: ["src/packages/**/melange.yaml"]
  workflow_dispatch:
    inputs:
      package:
        description: "Package folder name (e.g. nginx, vaultwarden, etc)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  YQ_VERSION: v4.53.6 # renovate: datasource=github-releases depName=mikefarah/yq
  BWRAP_VERSION: v0.12.0 # renovate: datasource=github-releases depName=containers/bubblewrap
  MELANGE_VERSION: v0.59.4 # renovate: datasource=github-releases depName=chainguard-dev/melange

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.expose.outputs.key }}
    steps:
      - name: Expose combined tool-version key
        id: expose
        run: echo "key=yq-$YQ_VERSION-bwrap-$BWRAP_VERSION-melange-$MELANGE_VERSION" >> "$GITHUB_OUTPUT"

  setup-build-matrix:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.set-packages.outputs.packages }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Get Changed Files
        if: ${{ github.event_name == 'push' }}
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: src/packages/**/melange.yaml

      - name: Set packages matrix output
        id: set-packages
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "packages=[\"src/packages/${{ github.event.inputs.package }}/melange.yaml\"]" >> "$GITHUB_OUTPUT"
          else
            FILES='${{ steps.changed-files.outputs.changed_files }}'
            if [ -z "$FILES" ]; then
              echo "packages=[]" >> "$GITHUB_OUTPUT"
            else
              echo "packages=$FILES" >> "$GITHUB_OUTPUT"
            fi
          fi

  setup-build-enviroment:
    needs: [setup-build-matrix, versions]
    if: ${{ needs.setup-build-matrix.outputs.packages != '[]' }}
    strategy:
      matrix:
        arch: [x86_64, aarch64]
      max-parallel: 2
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    concurrency:
      group: tools-${{ matrix.arch }}-${{ needs.versions.outputs.key }}
      cancel-in-progress: false
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check cache
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: tools-${{ matrix.arch }}-yq-${{ env.YQ_VERSION }}-bwrap-${{ env.BWRAP_VERSION }}-melange-${{ env.MELANGE_VERSION }}
          path: |
            /usr/local/bin/bwrap
            /usr/local/bin/melange
            /usr/local/bin/yq
          lookup-only: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
        with:
          go-version: '1.27'
          cache: false
          check-latest: true

      - name: Build yq
        if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
        run: |
          git clone --branch ${{ env.YQ_VERSION }} --depth 1 https://github.com/mikefarah/yq
          pushd yq
          go build -o /usr/local/bin/yq yq.go
          popd
          rm -rf yq

      - name: Build bubblewrap
        if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
        run: |
          sudo apt update
          sudo apt install -y libcap-dev meson ninja-build pkg-config
          git clone --branch ${{ env.BWRAP_VERSION }} --depth 1 https://github.com/containers/bubblewrap
          pushd bubblewrap
          meson setup --prefix=/usr/local . output
          pushd output
          ninja
          sudo ninja install
          popd
          popd
          rm -rf bubblewrap

      - name: Build melange
        if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
        run: |
          git clone --branch ${{ env.MELANGE_VERSION }} --depth 1 https://github.com/chainguard-dev/melange
          pushd melange
          go build -o /usr/local/bin/melange .
          popd
          rm -rf melange

      - name: Save to cache
        if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: tools-${{ matrix.arch }}-yq-${{ env.YQ_VERSION }}-bwrap-${{ env.BWRAP_VERSION }}-melange-${{ env.MELANGE_VERSION }}
          path: |
            /usr/local/bin/bwrap
            /usr/local/bin/melange
            /usr/local/bin/yq

  build:
    needs: [setup-build-matrix, setup-build-enviroment]
    if: ${{ needs.setup-build-matrix.outputs.packages != '[]' }}
    strategy:
      matrix:
        packages: ${{ fromJSON(needs.setup-build-matrix.outputs.packages) }}
        arch: [x86_64, aarch64]
      max-parallel: 4
      fail-fast: false
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Restore cached build tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: tools-${{ matrix.arch }}-yq-${{ env.YQ_VERSION }}-bwrap-${{ env.BWRAP_VERSION }}-melange-${{ env.MELANGE_VERSION }}
          fail-on-cache-miss: true
          path: |
            /usr/local/bin/bwrap
            /usr/local/bin/melange
            /usr/local/bin/yq

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get pipelines from wolfi-dev/os
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/wolfi-dev/os.git
          pushd os
          git sparse-checkout set --no-cone pipelines
          git checkout main
          mv pipelines $GITHUB_WORKSPACE/
          popd
          rm -rf os

      - name: Build and Push to Artifactory
        uses: d4rkfella/actions/melange-build@main
        with:
          arch: ${{ matrix.arch }}
          oidc-provider-name: github-oidc
          artifactory-url: https://packages.darkfellanetwork.com
          artifactory-repository-path: wolfi-os/latest/main
          config: ${{ matrix.packages }}
          sign-package: true
          signing-key: ${{ secrets.MELANGE_PRIVATE_KEY }}
          maintainer: darkfella
          pipeline-dir: ${{ github.workspace }}/pipelines
          repository-append: https://packages.darkfellanetwork.com/artifactory/wolfi-os/latest/main,https://packages.wolfi.dev/os
          keyring-append: https://packages.darkfellanetwork.com/artifactory/wolfi-os/melange.rsa.pub,https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
          tests-repository-append: https://packages.darkfellanetwork.com/artifactory/wolfi-os/latest/main,https://packages.wolfi.dev/os
          tests-keyring-append: https://packages.darkfellanetwork.com/artifactory/wolfi-os/melange.rsa.pub,https://packages.wolfi.dev/os/wolfi-signing.rsa.pub

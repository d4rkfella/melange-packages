
name: Setup Melange Build Environment
on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string

jobs:
  setup:
    runs-on: ${{ inputs.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      
      - name: Set Cache Key
        id: cache
        run: echo "key=$(date -u +'%G-%V')" >> $GITHUB_OUTPUT

      - name: Check cache
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: build-dependencies-${{ inputs.arch }}-${{ steps.cache.outputs.key }}
          path: |
            /usr/local/bin/bwrap
            /usr/local/bin/melange
            /usr/local/bin/yq
          lookup-only: true

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
        with:
          go-version: '1.26'
          cache: false
          check-latest: true

      - name: Build yq
        if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
        run: |
          git clone https://github.com/mikefarah/yq
          cd yq
          go build -o /usr/local/bin/yq yq.go
          cd ..
          rm -rf yq

      - name: Build bubblewrap
        if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
        run: |
          sudo apt update
          sudo apt install -y libcap-dev meson ninja-build pkg-config
          git clone https://github.com/containers/bubblewrap
          cd bubblewrap
          meson setup --prefix=/usr/local . output
          cd output
          ninja
          sudo ninja install
          cd ../..
          rm -rf bubblewrap

      - name: Build melange
        if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
        run: |
          git clone https://github.com/chainguard-dev/melange
          cd melange
          go build -o /usr/local/bin/melange .
          cd ..
          rm -rf melange

      - name: Save to cache
        if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: build-dependencies-${{ inputs.arch }}-${{ steps.cache.outputs.key }}
          path: |
            /usr/local/bin/bwrap
            /usr/local/bin/melange
            /usr/local/bin/yq

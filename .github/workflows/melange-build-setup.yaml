
name: Setup Melange Build Environment
on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      cache-key:
        required: true
        type: string
concurrency:
  group: melange-build-tools-${{ inputs.arch }}-${{ inputs.cache-key }}
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ${{ inputs.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
  
      - name: Check cache
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: build-dependencies-${{ inputs.arch }}-${{ inputs.cache-key }}
          path: |
            /usr/local/bin/bwrap
            /usr/local/bin/melange
            /usr/local/bin/yq
          lookup-only: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
        with:
          go-version: '1.27'
          cache: false
          check-latest: true

      - name: Build yq
        if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
        run: |
          git clone https://github.com/mikefarah/yq
          cd yq
          go build -o /usr/local/bin/yq yq.go
          cd ..
          rm -rf yq

      - name: Build bubblewrap
        if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
        run: |
          sudo apt update
          sudo apt install -y libcap-dev meson ninja-build pkg-config
          git clone https://github.com/containers/bubblewrap
          cd bubblewrap
          meson setup --prefix=/usr/local . output
          cd output
          ninja
          sudo ninja install
          cd ../..
          rm -rf bubblewrap

      - name: Build melange
        if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
        run: |
          git clone https://github.com/chainguard-dev/melange
          cd melange
          go build -o /usr/local/bin/melange .
          cd ..
          rm -rf melange

      - name: Save to cache
        if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: build-dependencies-${{ inputs.arch }}-${{ inputs.cache-key }}
          path: |
            /usr/local/bin/bwrap
            /usr/local/bin/melange
            /usr/local/bin/yq

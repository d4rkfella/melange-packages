name: Melange Renovator

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  update-packages:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      
      - name: Generate Token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: docker://ghcr.io/d4rkfella/melange-renovator:v0.6.6@sha256:87dea6a605620e0dc36d269da1ece0684b6303954db9ebea509090826c0cf73c
        env:
          RENOVATE_AUTODISCOVER: true
          RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository }}
          RENOVATE_CONFIG_FILE_PATTERNS: '^src/packages/[^/]+/melange\.ya?ml$'
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
          RENOVATE_AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          RENOVATE_AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          RENOVATE_S3_BUCKET: melange-renovator
          RENOVATE_LOG_LEVEL: debug

name: Melange Renovator
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  update-packages:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: docker://ghcr.io/d4rkfella/melange-renovator:v0.5.1@sha256:0b98b3acb405147d03822dc471535ebe491c44cd0140165939624287f6d0607a
        env:
          RENOVATE_AUTODISCOVER: true
          RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository }}
          RENOVATE_CONFIG_FILE_PATTERNS: '^src/packages/[^/]+/melange\.ya?ml$'
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
          RENOVATE_AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          RENOVATE_AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          RENOVATE_S3_BUCKET: melange-renovator
          RENOVATE_LOG_LEVEL: debug

name: Melange Renovator

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  update-packages:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: docker://ghcr.io/d4rkfella/melange-renovator:v0.6.1@sha256:f96dff4d5f8944c463aec63f240e1610a694cf6efc92938afaea1b2588ed2023
        env:
          RENOVATE_AUTODISCOVER: true
          RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository }}
          RENOVATE_CONFIG_FILE_PATTERNS: '^src/packages/[^/]+/melange\.ya?ml$'
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
          RENOVATE_AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          RENOVATE_AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          RENOVATE_S3_BUCKET: melange-renovator
          RENOVATE_LOG_LEVEL: debug
